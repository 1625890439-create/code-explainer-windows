<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Explainer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <style>
      /* ================================================================
         CYBERPUNK / MECH-TECH THEME — Code Explainer
         ================================================================ */

      /* ---- CSS Variables ---- */
      :root {
        --bg-deep:      #08090d;
        --bg-surface:   #11131a;
        --bg-card:      #161920;
        --bg-code:      #0b0d12;
        --text:         #d0d5e0;
        --text-dim:     #697088;
        --accent:       #00e5ff;
        --accent-dim:   rgba(0, 229, 255, 0.15);
        --accent-glow:  rgba(0, 229, 255, 0.40);
        --warn:         #ff6b35;
        --warn-dim:     rgba(255, 107, 53, 0.15);
        --success:      #00e676;
        --success-dim:  rgba(0, 230, 118, 0.15);
        --radius:       8px;
        --font-mono:    "Share Tech Mono", "Cascadia Code", "Fira Code", "Consolas", monospace;
        --font-ui:      "Segoe UI", system-ui, -apple-system, sans-serif;
        --scan-line:    rgba(0, 229, 255, 0.025);
        --border-glow:  rgba(0, 229, 255, 0.12);
      }

      /* ---- Reset ---- */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      /* ---- Scanline overlay (global) ---- */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9999;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          var(--scan-line) 2px,
          var(--scan-line) 4px
        );
      }

      body {
        font-family: var(--font-ui);
        background: var(--bg-deep);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ---- Grid background pattern ---- */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background-image:
          linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      /* ================================================================
         HEADER
         ================================================================ */
      header {
        position: relative;
        z-index: 1;
        padding: 14px 24px;
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-glow);
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 1px 12px rgba(0, 229, 255, 0.06);
      }
      header h1 {
        font-family: var(--font-mono);
        font-size: 17px;
        font-weight: 400;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: 0 0 12px var(--accent-glow);
      }
      header .sep {
        width: 1px; height: 18px;
        background: linear-gradient(180deg, transparent, var(--accent-dim), transparent);
      }
      header .status-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: var(--text-dim);
        box-shadow: 0 0 6px rgba(105, 112, 136, 0.5);
        transition: background 0.4s, box-shadow 0.4s;
      }
      header .status-dot.idle    { background: var(--text-dim);  box-shadow: 0 0 6px rgba(105, 112, 136, 0.5); }
      header .status-dot.loading { background: var(--accent);    box-shadow: 0 0 10px var(--accent-glow); animation: breathe 1.2s ease-in-out infinite; }
      header .status-dot.done    { background: var(--success);   box-shadow: 0 0 10px rgba(0, 230, 118, 0.6); }
      header .status-dot.error   { background: var(--warn);      box-shadow: 0 0 10px rgba(255, 107, 53, 0.6); }
      header .badge {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 1px;
        background: var(--accent-dim);
        color: var(--accent);
        padding: 3px 10px;
        border-radius: 2px;
        border: 1px solid rgba(0, 229, 255, 0.2);
        transition: all 0.3s;
      }

      /* ================================================================
         MAIN
         ================================================================ */
      main {
        position: relative;
        z-index: 1;
        flex: 1;
        padding: 24px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(0, 229, 255, 0.18) transparent;
      }
      /* Webkit 滚动条样式 */
      main::-webkit-scrollbar { width: 6px; }
      main::-webkit-scrollbar-track { background: transparent; }
      main::-webkit-scrollbar-thumb {
        background: rgba(0, 229, 255, 0.18);
        border-radius: 3px;
      }
      main::-webkit-scrollbar-thumb:hover { background: rgba(0, 229, 255, 0.35); }

      /* ---- Placeholder ---- */
      .placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        height: 100%;
        min-height: 55vh;
        gap: 16px;
        position: relative;
      }
      /* Radar sweep effect */
      .placeholder::before {
        content: "";
        position: absolute;
        width: 200px; height: 200px;
        border-radius: 50%;
        border: 1px solid rgba(0, 229, 255, 0.08);
        animation: radar-spin 6s linear infinite;
      }
      .placeholder::after {
        content: "";
        position: absolute;
        width: 120px; height: 120px;
        border-radius: 50%;
        border: 1px dashed rgba(0, 229, 255, 0.06);
        animation: radar-spin 10s linear infinite reverse;
      }
      .placeholder .icon {
        font-size: 40px;
        margin-bottom: 4px;
        filter: drop-shadow(0 0 12px var(--accent-glow));
        animation: float 3s ease-in-out infinite;
      }
      .placeholder p {
        color: var(--text-dim);
        font-size: 13px;
        letter-spacing: 0.5px;
      }
      .placeholder strong {
        color: var(--accent);
        font-weight: 400;
        text-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
      }
      .placeholder kbd {
        display: inline-block;
        font-family: var(--font-mono);
        font-size: 13px;
        background: var(--bg-code);
        color: var(--accent);
        padding: 3px 10px;
        border-radius: 3px;
        border: 1px solid rgba(0, 229, 255, 0.2);
        margin: 0 3px;
        box-shadow: 0 0 8px rgba(0, 229, 255, 0.15);
        animation: kbd-pulse 2s ease-in-out infinite;
      }
      .placeholder kbd:nth-child(2) { animation-delay: 0.15s; }
      .placeholder kbd:nth-child(3) { animation-delay: 0.30s; }

      /* ================================================================
         CARD
         ================================================================ */
      .card {
        position: relative;
        background: var(--bg-card);
        border: 1px solid var(--border-glow);
        border-radius: var(--radius);
        padding: 20px;
        margin-bottom: 20px;
        box-shadow:
          0 0 20px rgba(0, 229, 255, 0.04),
          inset 0 1px 0 rgba(255, 255, 255, 0.02);
        animation: card-in 0.5s ease-out;
        overflow: hidden;
      }
      /* Card corner decorations */
      .card::before, .card::after {
        content: "";
        position: absolute;
        width: 16px; height: 16px;
        border-color: var(--accent);
        border-style: solid;
        opacity: 0.5;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .card::before  { top: 4px; left: 4px; border-width: 1px 0 0 1px; }
      .card::after   { bottom: 4px; right: 4px; border-width: 0 1px 1px 0; }
      .card:hover::before, .card:hover::after { opacity: 0.9; }

      /* Card header */
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px dashed rgba(0, 229, 255, 0.1);
      }
      .card-header .lang-tag {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 1px;
        background: var(--accent-dim);
        color: var(--accent);
        padding: 2px 10px;
        border-radius: 2px;
        border: 1px solid rgba(0, 229, 255, 0.2);
      }
      .card-header .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-dim);
        letter-spacing: 0.5px;
      }

      /* ---- Code block ---- */
      pre.code-block {
        position: relative;
        background: var(--bg-code);
        border-radius: 4px;
        padding: 14px 16px 14px 28px;
        overflow-x: auto;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.7;
        max-height: 210px;
        white-space: pre-wrap;
        word-break: break-all;
        border: 1px solid rgba(255, 255, 255, 0.04);
      }
      /* IDE gutter line */
      pre.code-block::before {
        content: "";
        position: absolute;
        left: 12px; top: 14px; bottom: 14px;
        width: 1px;
        background: linear-gradient(180deg, var(--accent), transparent 60%);
        opacity: 0.3;
      }

      /* ---- Result sections ---- */
      .result-section {
        margin-top: 16px;
        animation: fade-up 0.4s ease-out;
      }
      .result-section h3 {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .result-section h3::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, rgba(0, 229, 255, 0.2), transparent);
      }
      .result-section p {
        font-size: 13px;
        line-height: 1.8;
        opacity: 0.85;
      }

      /* ---- Risks ---- */
      .risks {
        margin-top: 14px;
        padding: 10px 14px;
        background: var(--warn-dim);
        border: 1px solid rgba(255, 107, 53, 0.2);
        border-radius: 4px;
        list-style: none;
        animation: fade-up 0.4s ease-out 0.1s both;
      }
      .risks li {
        font-size: 13px;
        padding: 3px 0 3px 18px;
        color: var(--warn);
        position: relative;
      }
      .risks li::before {
        content: "";
        position: absolute;
        left: 0; top: 8px;
        width: 6px; height: 6px;
        border: 1px solid var(--warn);
        transform: rotate(45deg);
      }

      /* ---- Follow-ups ---- */
      .follow-ups {
        margin-top: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        animation: fade-up 0.4s ease-out 0.15s both;
      }
      .follow-ups .chip {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.5px;
        background: var(--accent-dim);
        color: var(--accent);
        padding: 5px 14px;
        border-radius: 2px;
        cursor: pointer;
        border: 1px solid rgba(0, 229, 255, 0.18);
        transition: all 0.25s;
        position: relative;
      }
      .follow-ups .chip:hover {
        background: rgba(0, 229, 255, 0.2);
        border-color: rgba(0, 229, 255, 0.5);
        box-shadow: 0 0 16px rgba(0, 229, 255, 0.2);
        transform: translateY(-1px);
      }
      .follow-ups .chip:active {
        background: rgba(0, 229, 255, 0.3);
        transition: none;
      }

      /* ---- Follow-up result cards (追加追问回答) ---- */
      .follow-up-card {
        position: relative;
        margin-top: 14px;
        padding: 16px 18px;
        background: var(--bg-card);
        border: 1px solid var(--border-glow);
        border-radius: var(--radius);
        animation: fade-up 0.35s ease-out;
        box-shadow: 0 0 16px rgba(0, 229, 255, 0.04);
      }
      .follow-up-card .fu-question {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--accent);
        margin-bottom: 10px;
        padding-bottom: 8px;
        border-bottom: 1px dashed rgba(0, 229, 255, 0.12);
        letter-spacing: 0.5px;
      }
      .follow-up-card .fu-answer {
        font-size: 13px;
        line-height: 1.7;
        color: var(--text);
      }
      .follow-up-card .fu-dismiss {
        position: absolute;
        top: 6px;
        right: 10px;
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 13px;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 2px;
        transition: all 0.2s;
      }
      .follow-up-card .fu-dismiss:hover {
        color: var(--warn);
        background: var(--warn-dim);
      }

      /* ---- Footer input for free-text follow-up ---- */
      .follow-up-input-row {
        margin-top: 18px;
        display: flex;
        gap: 8px;
        animation: fade-up 0.4s ease-out 0.2s both;
      }
      .follow-up-input-row input {
        flex: 1;
        background: var(--bg-code);
        border: 1px solid var(--border-glow);
        border-radius: 4px;
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 13px;
        padding: 10px 14px;
        outline: none;
        transition: border-color 0.25s;
      }
      .follow-up-input-row input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 10px rgba(0, 229, 255, 0.15);
      }
      .follow-up-input-row button {
        background: var(--accent-dim);
        border: 1px solid rgba(0, 229, 255, 0.25);
        border-radius: 4px;
        color: var(--accent);
        font-family: var(--font-mono);
        font-size: 13px;
        padding: 10px 18px;
        cursor: pointer;
        letter-spacing: 0.5px;
        transition: all 0.25s;
      }
      .follow-up-input-row button:hover {
        background: rgba(0, 229, 255, 0.2);
        border-color: var(--accent);
        box-shadow: 0 0 14px rgba(0, 229, 255, 0.2);
      }

      /* ---- Provider footnote ---- */
      .provider-footnote {
        margin-top: 14px;
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-dim);
        letter-spacing: 0.5px;
        opacity: 0.5;
        animation: fade-up 0.4s ease-out 0.2s both;
      }

      /* ================================================================
         SKELETON SCREEN (loading)
         ================================================================ */
      .skeleton-card {
        background: var(--bg-card);
        border: 1px solid var(--border-glow);
        border-radius: var(--radius);
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 0 20px rgba(0, 229, 255, 0.04);
        animation: card-in 0.4s ease-out;
      }
      .skeleton-row {
        height: 14px;
        border-radius: 3px;
        background: linear-gradient(
          90deg,
          rgba(0, 229, 255, 0.06) 25%,
          rgba(0, 229, 255, 0.12) 50%,
          rgba(0, 229, 255, 0.06) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.6s ease-in-out infinite;
        margin-bottom: 12px;
      }
      .skeleton-row:nth-child(1) { width: 35%; }
      .skeleton-row:nth-child(2) { width: 80%; }
      .skeleton-row:nth-child(3) { width: 55%; }
      .skeleton-row:nth-child(4) { width: 90%; margin-bottom: 0; }

      /* ================================================================
         ERROR CARD
         ================================================================ */
      .error-card {
        background: var(--warn-dim);
        border: 1px solid rgba(255, 107, 53, 0.3);
        border-radius: var(--radius);
        padding: 14px 18px;
        margin-top: 10px;
        position: relative;
        overflow: hidden;
        animation: glitch-in 0.4s ease-out;
      }
      .error-card p {
        color: var(--warn);
        font-size: 13px;
      }
      button.retry {
        margin-top: 10px;
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 1px;
        background: var(--warn-dim);
        color: var(--warn);
        border: 1px solid rgba(255, 107, 53, 0.35);
        padding: 6px 16px;
        border-radius: 2px;
        cursor: pointer;
        transition: all 0.25s;
      }
      button.retry:hover {
        background: rgba(255, 107, 53, 0.25);
        border-color: rgba(255, 107, 53, 0.6);
        box-shadow: 0 0 16px rgba(255, 107, 53, 0.2);
      }

      /* ================================================================
         KEYFRAMES
         ================================================================ */
      @keyframes breathe {
        0%, 100% { opacity: 0.5; }
        50%      { opacity: 1; }
      }
      @keyframes card-in {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fade-up {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes shimmer {
        0%   { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      @keyframes glitch-in {
        0%   { opacity: 0; clip-path: inset(0 0 100% 0); }
        80%  { clip-path: inset(0 0 0 0); }
        100% { opacity: 1; }
      }
      @keyframes radar-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-6px); }
      }
      @keyframes kbd-pulse {
        0%, 100% { box-shadow: 0 0 8px rgba(0, 229, 255, 0.15); }
        50%      { box-shadow: 0 0 20px rgba(0, 229, 255, 0.35); }
      }

      /* ---- Glow flash (result-ready) ---- */
      .card.result-ready {
        animation: card-in 0.5s ease-out, glow-flash 0.8s ease-out 0.3s;
      }
      @keyframes glow-flash {
        0%   { border-color: var(--accent); box-shadow: 0 0 30px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.02); }
        100% { border-color: var(--border-glow); box-shadow: 0 0 20px rgba(0,229,255,0.04), inset 0 1px 0 rgba(255,255,255,0.02); }
      }

      /* ---- Glitch border (error) ---- */
      .error-card.glitching {
        animation: glitch-in 0.4s ease-out, glitch-border 1s ease-in-out infinite;
      }
      @keyframes glitch-border {
        0%, 100% { border-color: rgba(255, 107, 53, 0.3); }
        25%      { border-color: var(--accent); }
        50%      { border-color: rgba(255, 107, 53, 0.3); }
        75%      { border-color: rgba(255, 107, 53, 0.6); }
      }

      /* ---- Particle canvas ---- */
      #particle-canvas {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>◈ Code Explainer</h1>
      <div class="sep"></div>
      <span class="status-dot idle" id="status-dot" title="状态"></span>
      <span class="badge" id="status-badge">就绪</span>
    </header>
    <main id="app-main">
      <!-- Placeholder -->
      <div class="placeholder" id="placeholder">
        <div class="icon">⚙</div>
        <p>在任意编辑器中 <strong>选中代码</strong></p>
        <p>
          <kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>\\</kbd>
        </p>
        <p style="margin-top:6px;font-size:11px;color:var(--text-dim);opacity:0.6">AutoHotkey v2 后台运行中</p>
      </div>
    </main>
    <canvas id="particle-canvas"></canvas>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
