<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Explainer</title>
    <style>
      :root {
        --bg: #1e1e2e;
        --surface: #2a2a3c;
        --text: #e0e0f0;
        --muted: #8888aa;
        --accent: #89b4fa;
        --danger: #f38ba8;
        --code-bg: #11111b;
        --radius: 8px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 16px 24px;
        background: var(--surface);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      header h1 { font-size: 18px; font-weight: 600; }
      header .badge {
        font-size: 11px;
        background: var(--accent);
        color: var(--code-bg);
        padding: 2px 8px;
        border-radius: 99px;
        font-weight: 600;
      }
      main {
        flex: 1;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow-y: auto;
      }
      .input-panel {
        background: var(--surface);
        border-radius: var(--radius);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex-shrink: 0;
      }
      .input-row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .input-row label {
        font-size: 13px;
        color: var(--muted);
        min-width: 50px;
      }
      .input-row input, .input-row select {
        background: var(--code-bg);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 4px;
        padding: 6px 10px;
        color: var(--text);
        font-size: 13px;
      }
      .input-row select { cursor: pointer; }
      textarea.code-input {
        width: 100%;
        min-height: 120px;
        background: var(--code-bg);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 6px;
        padding: 12px;
        color: var(--text);
        font-family: "Cascadia Code", "Fira Code", monospace;
        font-size: 13px;
        line-height: 1.5;
        resize: vertical;
      }
      textarea.code-input:focus, .input-row input:focus, .input-row select:focus {
        outline: none;
        border-color: var(--accent);
      }
      .btn-explain {
        align-self: flex-end;
        background: var(--accent);
        color: var(--code-bg);
        border: none;
        padding: 8px 20px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-explain:hover { opacity: 0.85; }
      .btn-explain:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .card {
        background: var(--surface);
        border-radius: var(--radius);
        padding: 16px;
      }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .card-header .lang-tag {
        font-size: 12px;
        background: rgba(137,180,250,0.15);
        color: var(--accent);
        padding: 2px 8px;
        border-radius: 4px;
      }
      .card-header .meta {
        font-size: 12px;
        color: var(--muted);
      }
      pre.code-block {
        background: var(--code-bg);
        border-radius: 6px;
        padding: 12px 16px;
        overflow-x: auto;
        font-family: "Cascadia Code", "Fira Code", monospace;
        font-size: 13px;
        line-height: 1.6;
        max-height: 200px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .result-section { margin-top: 12px; }
      .result-section h3 {
        font-size: 14px;
        color: var(--accent);
        margin-bottom: 6px;
      }
      .result-section p {
        font-size: 13px;
        line-height: 1.7;
        opacity: 0.85;
      }
      .risks { margin-top: 12px; }
      .risks li {
        font-size: 13px;
        padding: 4px 0;
        color: var(--danger);
        list-style: "⚠ ";
        margin-left: 1em;
      }
      .follow-ups {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .follow-ups .chip {
        font-size: 12px;
        background: rgba(137,180,250,0.1);
        color: var(--accent);
        padding: 4px 10px;
        border-radius: 99px;
        cursor: pointer;
        border: 1px solid rgba(137,180,250,0.2);
      }
      .follow-ups .chip:hover { background: rgba(137,180,250,0.2); }
      .spinner {
        width: 20px; height: 20px;
        border: 2px solid var(--muted);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        display: inline-block;
        margin-right: 8px;
        vertical-align: middle;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .error-card {
        background: rgba(243,139,168,0.1);
        border: 1px solid rgba(243,139,168,0.3);
        border-radius: var(--radius);
        padding: 12px 16px;
        margin-top: 8px;
      }
      .error-card p { color: var(--danger); font-size: 13px; }
      button.retry {
        margin-top: 8px;
        background: var(--accent);
        color: var(--code-bg);
        border: none;
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        font-weight: 500;
      }
      button.retry:hover { opacity: 0.85; }
      .result-block {
        flex: 1;
        overflow-y: auto;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Code Explainer</h1>
      <span class="badge" id="status-badge">就绪</span>
    </header>
    <main id="app-main">
      <!-- Input panel -->
      <div class="input-panel" id="input-panel">
        <div class="input-row">
          <label>语言</label>
          <select id="lang-select">
            <option value="">自动</option>
            <option value="typescript">TypeScript</option>
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
            <option value="sql">SQL</option>
            <option value="rust">Rust</option>
            <option value="go">Go</option>
            <option value="java">Java</option>
            <option value="csharp">C#</option>
            <option value="cpp">C++</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="shell">Shell</option>
            <option value="other">其他</option>
          </select>
          <label style="margin-left:12px">模式</label>
          <select id="mode-select">
            <option value="overview">概述</option>
            <option value="line-by-line">逐行</option>
            <option value="review">审查</option>
          </select>
        </div>
        <textarea class="code-input" id="code-input" placeholder="在此粘贴代码，然后点击「解释」&#10;&#10;或从任意编辑器 Ctrl+C 复制代码后回来粘贴"></textarea>
        <button class="btn-explain" id="btn-explain">⚡ 解释</button>
        <p class="hint">提示：选中代码 Ctrl+C → 回到这里 Ctrl+V → 点解释。也支持 AHK 热键 Ctrl+Alt+E（需安装 AutoHotkey v2）。</p>
      </div>
      <!-- Result area -->
      <div class="result-block" id="result-block"></div>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
